<!DOCTYPE html>
<html lang="es-CL">
<head>

  <title>Sin conexión — EnQuéGasto</title>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;

  <div class="card">
    <div style="font-size:48px">📡</div>

  </div>
