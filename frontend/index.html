<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e11d48" />
    <meta name="description" content="Para que no te preguntes en qué gasté mi plata a fin de mes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EnQuéGasto" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>EnQuéGasto — Controla tus suscripciones</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Forzar actualización del SW (limpia caches viejos con footer fantasma)
      if ('serviceWorker' in navigator) {
        const boot = async () => {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) {
              reg.active && reg.active.postMessage('CLEAR_CACHES');
              reg.active && reg.active.postMessage('SKIP_WAITING');
            }
            await navigator.serviceWorker.register('/sw.js?v=4');
          } catch (e) {}
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(() => boot(), { timeout: 3000 });
        } else {
          window.addEventListener('load', () => setTimeout(boot, 100));
        }
      }
    </script>
  </body>
</html>
