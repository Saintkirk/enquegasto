# Render Blueprint para EnQuéGasto Backend
services:
  - type: web
    name: enquegasto-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install --production=false && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: enquegasto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
databases:
  - name: enquegasto-db
    plan: free
    databaseName: enquegasto
    user: enquegasto
